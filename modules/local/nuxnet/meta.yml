---
name: "nuxnet"
description: PyTorch-based nuclei segmentation and centroid localization.
keywords:
  - nuclei segmentation
  - centroid localization
  - pytorch
  - unet
tools:
  - "nuxnet":
      description: "PyTorch-based nuclei segmentation and centroid localization tool."
      homepage: ""
      documentation: ""
      tool_dev_url: ""
      doi: ""
      licence: ""
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1']`

    - img_directory:
        type: directory
        description: Input stitched image directory

    - parameter_file:
        type: file
        description: Parameter CSV used by upstream NuMorph steps
        pattern: "*.csv"

  - model_file:
      type: file
      description: Trained model checkpoint file

output:
  - cellcounts:
      - "*/*":
          type: file
          description: Per-sample nuclei predictions and count tables

  - versions:
      - "versions.yml":
          type: file
          description: File containing software versions
          pattern: "versions.yml"

authors:
  - "@CaroAMN"
maintainers:
  - "@CaroAMN"
---
